<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSD — Adam Wilson</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070f;--bg2:#0f0f1a;--bg3:#161625;--bg4:#1e1e30;
  --border:rgba(255,255,255,0.06);--text:#ddddf0;--muted:#3d3d5c;
  --today:#ff4d6d;--week:#ffb703;--someday:#4a4a6a;--done:#50f0a0;
  --accent:#c8f050;--accent2:#50c8f0;
  --monday:#a78bfa;--wednesday:#34d399;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");pointer-events:none;z-index:1000}
.header{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative}
.header::before{content:'';position:absolute;bottom:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,var(--accent),transparent 60%)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--accent);line-height:1}
.header-date{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.done-badge{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:2px}
.done-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:-2px}
.gcal-btn{padding:5px 12px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.gcal-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.gcal-btn.connected{border-color:rgba(80,200,240,0.3);color:var(--accent2)}
.signout-btn{padding:5px 12px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;transition:all 0.2s}
.signout-btn:hover{border-color:var(--today);color:var(--today)}
.quote{padding:7px 24px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,240,80,0.4);background:linear-gradient(90deg,rgba(200,240,80,0.03),transparent);transition:opacity 0.5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layout{display:grid;grid-template-columns:260px 1fr;flex:1;overflow:hidden;min-height:0}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sidebar::-webkit-scrollbar{width:2px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border)}
.sec-hdr{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.cal-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--bg2);margin-bottom:3px;border-left:2px solid var(--accent2)}
.cal-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent2);min-width:34px;font-weight:500}
.cal-title{font-size:11px;flex:1;line-height:1.3;color:var(--text)}
.cal-meet{font-size:10px;color:var(--accent);text-decoration:none;margin-left:4px}
.focus-tip{padding:6px 10px;border-radius:6px;background:rgba(200,240,80,0.04);border:1px solid rgba(200,240,80,0.1);font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;margin-top:6px}
.cal-empty{font-size:10px;color:var(--muted);padding:6px 10px;font-family:'DM Mono',monospace}
.cal-loading{font-size:10px;color:var(--muted);padding:6px 10px;font-family:'DM Mono',monospace;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
.connect-cal{padding:8px 10px;border-radius:6px;background:rgba(80,200,240,0.05);border:1px dashed rgba(80,200,240,0.2);font-size:10px;color:var(--accent2);font-family:'DM Mono',monospace;cursor:pointer;text-align:center;transition:all 0.2s;letter-spacing:1px}
.connect-cal:hover{background:rgba(80,200,240,0.1);border-color:rgba(80,200,240,0.4)}
.rec-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:var(--bg2);margin-bottom:3px;border-left:2px solid;transition:all 0.2s;cursor:pointer}
.rec-check{width:14px;height:14px;border-radius:3px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.rec-check-icon{color:var(--bg);font-size:8px;font-weight:900;display:none}
.rec-text{font-size:11px;flex:1}
.rec-day{font-family:'DM Mono',monospace;font-size:8px;padding:1px 5px;border-radius:3px;flex-shrink:0}
.add-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.add-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.add-row{display:flex;gap:6px;margin-bottom:6px}
.add-input{flex:1;padding:6px 10px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
.add-input:focus{border-color:rgba(200,240,80,0.4)}
.add-input::placeholder{color:var(--muted)}
.pri-sel{padding:6px 8px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:10px;font-family:'DM Mono',monospace;outline:none;cursor:pointer}
.add-btn{padding:6px 14px;border-radius:5px;background:var(--accent);border:none;color:var(--bg);font-family:'Bebas Neue',sans-serif;letter-spacing:1px;cursor:pointer;transition:all 0.15s;white-space:nowrap;font-size:13px}
.add-btn:hover{background:#d8ff60;transform:translateY(-1px)}
.main{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:20px}
.main::-webkit-scrollbar{width:2px}
.main::-webkit-scrollbar-thumb{background:var(--border)}
.pri-section-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.pri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pri-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px}
.pri-count{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);background:var(--bg3);padding:1px 6px;border-radius:20px;margin-left:auto}
.pri-chev{font-size:9px;color:var(--muted)}
.pri-body.collapsed{display:none}
.task-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;background:var(--bg2);margin-bottom:3px;border:1px solid var(--border);transition:all 0.25s;position:relative;overflow:hidden}
.task-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;transition:background 0.2s}
.task-item.priority-today::before{background:var(--today)}
.task-item.priority-week::before{background:var(--week)}
.task-item.priority-someday::before{background:var(--someday)}
.task-item.priority-done::before{background:var(--done)}
.task-item:hover{background:var(--bg3)}
.task-item:hover .task-actions{opacity:1}
.task-item.removing{opacity:0;transform:translateX(30px);max-height:0;padding:0;margin:0;border:none}
.task-item.is-done .task-text{text-decoration:line-through;color:var(--muted)}
.task-check{width:16px;height:16px;border-radius:4px;flex-shrink:0;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;background:transparent}
.task-check:hover{border-color:var(--accent)}
.chk-icon{color:#fff;font-size:9px;font-weight:900;display:none}
.task-text{font-size:12px;flex:1;line-height:1.4}
.task-time{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);flex-shrink:0}
.pri-toggle{display:flex;gap:3px;flex-shrink:0}
.pri-btn{width:20px;height:20px;border-radius:4px;border:none;cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:var(--bg3);color:var(--muted)}
.pri-btn:hover{transform:scale(1.15)}
.pri-btn.active-today{background:rgba(255,77,109,0.2);color:var(--today)}
.pri-btn.active-week{background:rgba(255,183,3,0.15);color:var(--week)}
.pri-btn.active-someday{background:var(--bg4);color:var(--muted)}
.task-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.15s;flex-shrink:0}
.t-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all 0.12s}
.t-btn:hover{background:var(--bg);color:var(--text)}
.t-btn.del:hover{color:var(--today)}
.t-btn.undo:hover{color:var(--done)}
.empty-state{padding:12px;text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
.status{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:9px;color:var(--accent);opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:500;letter-spacing:1px}
.status.show{opacity:1}
.status.error{color:var(--today)}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999;transition:opacity 0.4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:8px;color:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
.loading-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
/* ── AUTH GATE ── */
.auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:998}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:6px;color:var(--accent)}
.auth-box{display:flex;flex-direction:column;gap:10px;width:260px}
.auth-input{padding:10px 12px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.auth-input:focus{border-color:rgba(200,240,80,0.4)}
.auth-btn{padding:10px;border-radius:6px;background:var(--accent);border:none;color:var(--bg);font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:14px;cursor:pointer}
.auth-btn:hover{background:#d8ff60}
.auth-msg{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;letter-spacing:1px}
.auth-msg.error{color:var(--today)}
.auth-msg.ok{color:var(--done)}
@media(max-width:768px){.layout{grid-template-columns:1fr;height:auto;overflow:visible}html,body{height:auto;overflow:auto}.sidebar{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">GSD</div>
  <div class="loading-sub">Loading...</div>
</div>

<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-logo">GSD</div>
  <div class="auth-box">
    <input class="auth-input" id="authEmail" placeholder="your email" type="email">
    <button class="auth-btn" onclick="sendMagicLink()">SEND LOGIN LINK</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<div id="appRoot" style="display:none;flex-direction:column;height:100%">

<div class="header">
  <div>
    <div class="logo">GSD</div>
    <div class="header-date" id="dateEl"></div>
  </div>
  <div class="header-right">
    <button class="gcal-btn" id="calBtn" onclick="handleCalAuth()">
      <span>📅</span><span id="calBtnText">Connect Calendar</span>
    </button>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
    <div style="text-align:right">
      <div class="done-badge" id="doneCount">0</div>
      <div class="done-label">done today</div>
    </div>
  </div>
</div>

<div class="quote" id="quoteEl"></div>

<div class="layout">
  <div class="sidebar">
    <div>
      <div class="sec-hdr">📅 Today</div>
      <div id="calEl"><div class="cal-loading">loading calendar...</div></div>
      <div class="focus-tip" id="focusTip"></div>
    </div>

    <div>
      <div class="sec-hdr">🔁 Weekly</div>
      <div id="recurringEl"></div>
    </div>

    <div class="add-box">
      <div class="add-label">+ New Task</div>
      <div class="add-row">
        <input class="add-input" id="newText" placeholder="What needs doing..." onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="add-row">
        <select class="pri-sel" id="newPri">
          <option value="today">🔴 Today</option>
          <option value="week">🟡 This Week</option>
          <option value="someday">⚪ Someday</option>
        </select>
        <button class="add-btn" onclick="addTask()">ADD</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="pri-section">
      <div class="pri-section-header" onclick="toggleSec('today')">
        <div class="pri-dot" style="background:var(--today)"></div>
        <span class="pri-title" style="color:var(--today)">Today</span>
        <span class="pri-count" id="cnt-today">0</span>
        <span class="pri-chev" id="chev-today">▾</span>
      </div>
      <div class="pri-body" id="body-today"></div>
    </div>

    <div class="pri-section">
      <div class="pri-section-header" onclick="toggleSec('week')">
        <div class="pri-dot" style="background:var(--week)"></div>
        <span class="pri-title" style="color:var(--week)">This Week</span>
        <span class="pri-count" id="cnt-week">0</span>
        <span class="pri-chev" id="chev-week">▾</span>
      </div>
      <div class="pri-body" id="body-week"></div>
    </div>

    <div class="pri-section">
      <div class="pri-section-header" onclick="toggleSec('someday')">
        <div class="pri-dot" style="background:var(--someday)"></div>
        <span class="pri-title" style="color:#6b6b8a">Someday</span>
        <span class="pri-count" id="cnt-someday">0</span>
        <span class="pri-chev" id="chev-someday">▾</span>
      </div>
      <div class="pri-body" id="body-someday"></div>
    </div>

    <div class="pri-section">
      <div class="pri-section-header" onclick="toggleSec('done')">
        <div class="pri-dot" style="background:var(--done)"></div>
        <span class="pri-title" style="color:var(--done)">Done Today</span>
        <span class="pri-count" id="cnt-done">0</span>
        <span class="pri-chev" id="chev-done">▾</span>
      </div>
      <div class="pri-body" id="body-done"></div>
    </div>
  </div>
</div>

</div>

<div class="status" id="statusEl"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPABASE_URL='https://mijytrrovdufcdjfpxrf.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1panl0cnJvdmR1ZmNkamZweHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzU3NzUsImV4cCI6MjA5NDc1MTc3NX0.yJCJUsR6XT6QNDjPxXKoYn5hqmB4M7eO-6jvQ8LhFNM';
const GCAL_CLIENT_ID='662999455684-ffu1vpnkvdq699uol7e8b5he23m81ei8.apps.googleusercontent.com';
const GCAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
const TASKS_KEY='adam_gsd_tasks';
const RECUR_KEY='adam_gsd_recurring';
const DONE_KEY='adam_gsd_done';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ── RECURRING ─────────────────────────────────────────────────────────────────
const RECURRING=[
  {id:'rec1',text:'Send assets to contact list',day:1,color:'var(--monday)'},
  {id:'rec2',text:'Send assets to team',day:1,color:'var(--monday)'},
  {id:'rec3',text:'Send key events to affiliates',day:1,color:'var(--monday)'},
  {id:'rec4',text:'Send weekly content to database',day:1,color:'var(--monday)'},
  {id:'rec5',text:'Workers newsletter',day:1,color:'var(--monday)'},
  {id:'rec6',text:'Main newsletter',day:3,color:'var(--wednesday)'},
];

const QUOTES=["The secret of getting ahead is getting started.","Done is better than perfect.","Focus on being productive instead of busy.","Stop overthinking. Start doing.","Your future self is watching. Don't let them down.","Work hard in silence. Let success make the noise.","Discipline is choosing what you want most over what you want now.","One task at a time. One day at a time.","Energy flows where attention goes.","Every action is a vote for the person you want to become.","The pain of discipline weighs ounces. Regret weighs tons.","Small daily improvements lead to staggering long-term results."];
const FOCUS=['Weekend 🛋️','Monday sends day — clear the list ⚡','Free window in the morning — use it','Mid-week push — hit urgent first','Best focus before noon','Wrap the week strong 💪','Weekend 🛋️'];

// ── STATE ─────────────────────────────────────────────────────────────────────
const now=new Date(),dow=now.getDay();
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const weekNum=Math.floor((now-new Date(now.getFullYear(),0,1))/(7*24*60*60*1000));
const todayStr=now.toISOString().slice(0,10);

let tasks=[],recurDone={},doneHistory=[],saveTimer=null;
let calAccessToken=localStorage.getItem('gcal_token')||null;
let tokenExpiry=parseInt(localStorage.getItem('gcal_expiry')||'0');

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function sendMagicLink(){
  const email=document.getElementById('authEmail').value.trim();
  const msg=document.getElementById('authMsg');
  if(!email){msg.textContent='enter your email';msg.className='auth-msg error';return;}
  msg.textContent='sending...';msg.className='auth-msg';
  const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href}});
  if(error){msg.textContent='error — try again';msg.className='auth-msg error';return;}
  msg.textContent='check your email for the login link ✓';msg.className='auth-msg ok';
}
async function signOut(){
  await sb.auth.signOut();
  location.reload();
}
async function checkAuth(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appRoot').style.display='flex';
    init();
  } else {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('authScreen').style.display='flex';
  }
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appRoot').style.display='flex';
    init();
  }
});

// ── GOOGLE CALENDAR AUTH ──────────────────────────────────────────────────────
function handleCalAuth(){
  if(calAccessToken && Date.now()<tokenExpiry){
    loadCalendar();
    return;
  }
  const client=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID,
    scope:GCAL_SCOPE,
    callback:(response)=>{
      if(response.access_token){
        calAccessToken=response.access_token;
        tokenExpiry=Date.now()+(response.expires_in*1000);
        localStorage.setItem('gcal_token',calAccessToken);
        localStorage.setItem('gcal_expiry',tokenExpiry.toString());
        updateCalBtn(true);
        loadCalendar();
      }
    }
  });
  client.requestAccessToken();
}

function updateCalBtn(connected){
  const btn=document.getElementById('calBtn');
  const txt=document.getElementById('calBtnText');
  if(connected){btn.classList.add('connected');txt.textContent='Calendar Connected';}
  else{btn.classList.remove('connected');txt.textContent='Connect Calendar';}
}

async function loadCalendar(){
  if(!calAccessToken||Date.now()>=tokenExpiry){
    document.getElementById('calEl').innerHTML=`<div class="connect-cal" onclick="handleCalAuth()">📅 Connect Google Calendar</div>`;
    updateCalBtn(false);
    return;
  }
  updateCalBtn(true);
  document.getElementById('calEl').innerHTML=`<div class="cal-loading">loading...</div>`;
  try{
    const start=new Date(now);start.setHours(0,0,0,0);
    const end=new Date(now);end.setHours(23,59,59,999);
    const url=`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${start.toISOString()}&timeMax=${end.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=20`;
    const res=await fetch(url,{headers:{Authorization:`Bearer ${calAccessToken}`}});
    if(!res.ok){
      if(res.status===401){
        calAccessToken=null;localStorage.removeItem('gcal_token');localStorage.removeItem('gcal_expiry');
        document.getElementById('calEl').innerHTML=`<div class="connect-cal" onclick="handleCalAuth()">📅 Reconnect Calendar</div>`;
        updateCalBtn(false);return;
      }
      throw new Error('Calendar fetch failed');
    }
    const data=await res.json();
    const events=data.items||[];
    const calEl=document.getElementById('calEl');
    if(!events.length){calEl.innerHTML=`<div class="cal-empty">No meetings today 🎉</div>`;return;}
    calEl.innerHTML='';
    events.forEach(ev=>{
      if(!ev.start)return;
      const isAllDay=!!ev.start.date;
      if(isAllDay)return;
      const start=new Date(ev.start.dateTime);
      const time=start.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const meet=ev.hangoutLink?`<a href="${ev.hangoutLink}" target="_blank" class="cal-meet">📹</a>`:'';
      calEl.innerHTML+=`<div class="cal-item"><span class="cal-time">${time}</span><span class="cal-title">${ev.summary||'(no title)'}${meet}</span></div>`;
    });
  }catch(e){
    document.getElementById('calEl').innerHTML=`<div class="cal-empty">Calendar error — tap to retry</div>`;
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const{data,error}=await sb.from('tasks').select('data').eq('id',TASKS_KEY).single();
    if(data&&!error)tasks=data.data||[];
  }catch(e){tasks=[];}
  try{
    const{data,error}=await sb.from('tasks').select('data').eq('id',RECUR_KEY).single();
    if(data&&!error)recurDone=data.data||{};
  }catch(e){recurDone={};}
  try{
    const{data,error}=await sb.from('tasks').select('data').eq('id',DONE_KEY).single();
    if(data&&!error)doneHistory=data.data||[];
  }catch(e){doneHistory=[];}

  document.getElementById('dateEl').textContent=`${days[dow]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`.toUpperCase();

  let qi=Math.floor(Math.random()*QUOTES.length);
  document.getElementById('quoteEl').textContent='→ '+QUOTES[qi];
  setInterval(()=>{qi=(qi+1)%QUOTES.length;const el=document.getElementById('quoteEl');el.style.opacity='0';setTimeout(()=>{el.textContent='→ '+QUOTES[qi];el.style.opacity='1';},500);},15000);

  document.getElementById('focusTip').textContent='💡 '+FOCUS[dow];

  if(calAccessToken&&Date.now()<tokenExpiry){
    updateCalBtn(true);
    loadCalendar();
  } else {
    document.getElementById('calEl').innerHTML=`<div class="connect-cal" onclick="handleCalAuth()">📅 Connect Google Calendar</div>`;
  }

  renderAll();
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveTasks(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await sb.from('tasks').upsert({id:TASKS_KEY,data:tasks,updated_at:new Date().toISOString()});showStatus('✓ saved');}
    catch(e){showStatus('⚠ offline',true);}
  },500);
}
async function saveRecur(){
  try{await sb.from('tasks').upsert({id:RECUR_KEY,data:recurDone,updated_at:new Date().toISOString()});}catch(e){}
}
async function saveDone(){
  try{await sb.from('tasks').upsert({id:DONE_KEY,data:doneHistory,updated_at:new Date().toISOString()});showStatus('✓ saved');}
  catch(e){showStatus('⚠ offline',true);}
}
function showStatus(msg,err=false){
  const el=document.getElementById('statusEl');
  el.textContent=msg;el.className='status show'+(err?' error':'');
  setTimeout(()=>el.classList.remove('show'),1800);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll(){renderRecurring();renderPriority('today');renderPriority('week');renderPriority('someday');renderDone();updateDoneCount();}

function renderRecurring(){
  const el=document.getElementById('recurringEl');
  let html='';
  RECURRING.forEach(r=>{
    const isDone=recurDone[r.id]===weekNum;
    const dayLabel=r.day===1?'MON':'WED';
    const isToday=r.day===dow;
    html+=`<div class="rec-item" style="border-color:${r.color};${isDone?'opacity:0.3':''}" onclick="toggleRecur('${r.id}')">
      <div class="rec-check" style="${isDone?'background:'+r.color+';border-color:'+r.color:'border-color:var(--muted)'}">
        <span class="rec-check-icon" style="${isDone?'display:block':''}">✓</span>
      </div>
      <span class="rec-text" style="${isDone?'text-decoration:line-through':''}font-size:11px">${r.text}</span>
      <span class="rec-day" style="background:${r.color}22;color:${r.color};font-family:'DM Mono',monospace;font-size:8px;padding:1px 5px;border-radius:3px;${isToday?'font-weight:700':''}">${dayLabel}</span>
    </div>`;
  });
  el.innerHTML=html;
}

function renderPriority(pri){
  const body=document.getElementById('body-'+pri);
  const items=tasks.filter(t=>t.priority===pri);
  if(!items.length){body.innerHTML=`<div class="empty-state">${pri==='today'?'nothing for today yet':'empty'}</div>`;document.getElementById('cnt-'+pri).textContent=0;return;}
  let html='';
  items.forEach(t=>{
    html+=`<div class="task-item priority-${pri}" id="task-${t.id}">
      <div class="task-check" onclick="completeTask('${t.id}')"><span class="chk-icon">✓</span></div>
      <span class="task-text">${t.text}</span>
      <div class="pri-toggle">
        <button class="pri-btn ${pri==='today'?'active-today':''}" onclick="setPri('${t.id}','today')" title="Today">🔴</button>
        <button class="pri-btn ${pri==='week'?'active-week':''}" onclick="setPri('${t.id}','week')" title="This Week">🟡</button>
        <button class="pri-btn ${pri==='someday'?'active-someday':''}" onclick="setPri('${t.id}','someday')" title="Someday">⚪</button>
      </div>
      <div class="task-actions">
        <button class="t-btn del" onclick="deleteTask('${t.id}')">×</button>
      </div>
    </div>`;
  });
  body.innerHTML=html;
  document.getElementById('cnt-'+pri).textContent=items.length;
}

function renderDone(){
  const body=document.getElementById('body-done');
  const items=doneHistory.filter(t=>t.completedAt&&t.completedAt.slice(0,10)===todayStr);
  if(!items.length){body.innerHTML=`<div class="empty-state">nothing completed yet today</div>`;document.getElementById('cnt-done').textContent=0;return;}
  let html='';
  items.slice().reverse().forEach(t=>{
    const time=new Date(t.completedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="task-item priority-done is-done" id="done-${t.id}">
      <div class="task-check" style="background:var(--done);border-color:var(--done)"><span class="chk-icon" style="display:block">✓</span></div>
      <span class="task-text">${t.text}</span>
      <span class="task-time">${time}</span>
      <div class="task-actions">
        <button class="t-btn undo" onclick="undoTask('${t.id}')" title="Undo">↺</button>
      </div>
    </div>`;
  });
  body.innerHTML=html;
  document.getElementById('cnt-done').textContent=items.length;
}

function updateDoneCount(){
  const n=doneHistory.filter(t=>t.completedAt&&t.completedAt.slice(0,10)===todayStr).length;
  document.getElementById('doneCount').textContent=n;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function completeTask(id){
  const el=document.getElementById('task-'+id);
  if(!el)return;
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  const check=el.querySelector('.task-check');
  check.style.background='var(--done)';check.style.borderColor='var(--done)';
  el.querySelector('.chk-icon').style.display='block';
  el.classList.add('removing');
  setTimeout(()=>{
    tasks=tasks.filter(x=>x.id!==id);
    doneHistory.push({...t,completedAt:new Date().toISOString()});
    saveTasks();saveDone();renderAll();
  },280);
}
function undoTask(id){
  const t=doneHistory.find(x=>x.id===id);
  if(!t)return;
  doneHistory=doneHistory.filter(x=>x.id!==id);
  const{completedAt,...restored}=t;
  tasks.push(restored);
  saveTasks();saveDone();renderAll();
}
function deleteTask(id){
  const el=document.getElementById('task-'+id);
  if(el)el.classList.add('removing');
  setTimeout(()=>{tasks=tasks.filter(t=>t.id!==id);saveTasks();renderAll();},280);
}
function setPri(id,pri){
  const t=tasks.find(t=>t.id===id);
  if(t){t.priority=pri;saveTasks();renderAll();}
}
function addTask(){
  const text=document.getElementById('newText').value.trim();
  const pri=document.getElementById('newPri').value;
  if(!text)return;
  tasks.push({id:'t'+Date.now(),text,priority:pri});
  saveTasks();renderAll();
  document.getElementById('newText').value='';
  document.getElementById('newText').focus();
}
function toggleRecur(id){
  if(recurDone[id]===weekNum)delete recurDone[id];
  else recurDone[id]=weekNum;
  saveRecur();renderRecurring();
}
function toggleSec(id){
  const b=document.getElementById('body-'+id),c=document.getElementById('chev-'+id);
  b.classList.toggle('collapsed');
  c.textContent=b.classList.contains('collapsed')?'▸':'▾';
}

checkAuth();
</script>
</body>
</html>
